:root{
  /* Ночь за окном и свиток под восковой печатью: письмо, которое принёс ворон.
     Внутри письма приёмы рукописи: красные инициалы и пометки, римские номера, приписка чужой рукой. */
  --night:#0c1521;
  --frost:#a3b5c8;
  --parchment:#e6d5b0;
  --ink:#2a1e13;
  --rubric:#9b2a1c;
  --wax:#7a1319;
  --bran-ink:#263d56;
  --font-display:"Alegreya SC","Alegreya",Georgia,"Times New Roman",serif;
  --font-body:"Alegreya",Georgia,"Times New Roman",serif;
  --font-hand:"Marck Script","Segoe Script","Comic Sans MS",cursive;
  color-scheme:dark;
}

[hidden]{display:none !important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--night);
  color:var(--frost);
  font-family:var(--font-body);
  font-size:18px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(110% 60% at 50% -5%, #1d2c3e 0%, rgba(29,44,62,0) 62%),
    linear-gradient(180deg, var(--night) 0%, #101b28 100%);
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.07;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .8  0 0 0 0 .87  0 0 0 0 .95  0 0 0 1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
#app{min-height:100%;display:flex;flex-direction:column}

/* ---------- Печать ---------- */
.gate{
  flex:1 0 auto;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:26px;
  padding:40px 20px 52px;
  text-align:center;
}
.scroll{position:relative;width:min(560px,calc(100vw - 4px))}
.scroll-img{display:block;width:100%;height:auto;filter:drop-shadow(0 12px 14px rgba(0,0,0,.55))}
.seal{
  position:absolute;left:50%;top:50%;width:27%;aspect-ratio:1/1;
  transform:translate(-50%,-50%);
  filter:drop-shadow(0 8px 10px rgba(0,0,0,.5));
}
.seal-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.crack{fill:none;stroke:#260406;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}

.gate-text{display:flex;flex-direction:column;align-items:center;gap:10px}
.gate h1{
  margin:0;
  font-family:var(--font-display);font-weight:500;
  font-size:clamp(2.15rem,9.4vw,3.3rem);line-height:1.02;letter-spacing:.01em;
  color:#efe4cb;
  text-wrap:balance;
}
.note{margin:0;max-width:21em;font-style:italic;font-size:1.08rem;color:var(--frost);text-wrap:balance}

.step{display:flex;flex-direction:column;align-items:center;gap:16px;width:min(100%,360px)}
.q{margin:0;font-size:1.28rem;line-height:1.35;color:#e3eaf1;text-wrap:balance}
.actions{display:flex;flex-wrap:wrap;gap:12px;width:100%}
.btn{
  flex:1 1 140px;min-height:52px;padding:14px 22px;
  border-radius:12px;border:1.5px solid transparent;
  font-family:var(--font-display);font-weight:500;font-size:1.16rem;line-height:1;letter-spacing:.02em;
  cursor:pointer;
  transition:background-color .15s ease, border-color .15s ease, transform .1s ease;
}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--wax);color:#f6ead0;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 16px rgba(0,0,0,.35)}
.btn-primary:hover{background:#8e1a20}
.btn-primary:disabled{cursor:progress;background:#5f1217;color:#d9c7a8}
.btn-ghost{background:transparent;color:#d3dde7;border-color:#4a5d72}
.btn-ghost:hover{border-color:#6f849a}
.btn-link{
  background:none;border:0;padding:6px 4px;cursor:pointer;
  font:inherit;font-size:1.05rem;color:var(--frost);
  text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px;
}
.btn:focus-visible,.btn-link:focus-visible,#answer:focus-visible{outline:2px solid #e8d6a2;outline-offset:3px}

.answer-label{font-family:var(--font-display);font-weight:500;font-size:1.6rem;line-height:1.15;color:#efe4cb;text-wrap:balance}
.hint{margin:-8px 0 0;font-style:italic;color:var(--frost)}
.field{display:flex;flex-direction:column;gap:12px;width:100%}
.field > .btn{flex:0 0 auto}
#answer{
  width:100%;min-height:54px;padding:12px 16px;
  border-radius:12px;border:1.5px solid #c6ad80;
  background:var(--parchment);color:var(--ink);
  font-family:var(--font-body);font-size:1.3rem;text-align:center;
}
#answer::placeholder{color:#8a7454}
.feedback{min-height:1.5em;margin:0;font-style:italic;font-size:1.1rem;line-height:1.35;color:#eba897;text-wrap:balance}

/* ---------- Письмо ---------- */
.letter{
  /* ширина рулона с набалдашниками; лист = 1.35 / 1.54 от неё (рендер), чуть уже, чтобы края уходили под рулон */
  --roll-w:min(calc(100vw + 18px),1000px);
  --tex-w:calc(var(--roll-w) * 0.8634);
  display:flex;flex-direction:column;align-items:center;
  padding:22px 0 72px;
  overflow-x:hidden;overflow-x:clip;
}
.letter .roll{display:block;width:var(--roll-w);max-width:none;height:auto;position:relative;z-index:2;filter:drop-shadow(0 9px 10px rgba(0,0,0,.5))}
.roll-top{margin-bottom:calc(var(--roll-w) * -0.0513)}
.roll-bottom{margin-top:calc(var(--roll-w) * -0.0513)}
.unroll{width:var(--tex-w);overflow:hidden;position:relative;z-index:1;background:url(sheet.webp) center top / 100% auto repeat-y}
.sheet{
  padding:calc(var(--roll-w) * 0.085) calc(var(--tex-w) * 0.037 + 22px) calc(var(--roll-w) * 0.075);
  color:var(--ink);
  font-size:1.1rem;line-height:1.62;
  hyphens:manual;-webkit-hyphens:manual;
  overflow-wrap:break-word;
}
.sheet > *{max-width:34em;margin-left:auto;margin-right:auto}
.sheet p{margin-top:0;margin-bottom:1em}
.opening{display:flow-root}
.opening::first-letter{
  float:left;
  font-family:var(--font-display);font-weight:700;
  font-size:3.3em;line-height:.8;
  margin:.07em .1em 0 0;
  color:var(--rubric);
}
.sheet h2{
  margin-top:1.9em;margin-bottom:.75em;
  font-family:var(--font-display);font-weight:500;
  font-size:1.38em;line-height:1.15;letter-spacing:.01em;
  text-wrap:balance;
}
.facts{list-style:none;padding:0}
.facts li{position:relative;padding-left:1.25em;margin:0 0 .7em}
.facts li::before{
  content:"";position:absolute;left:.18em;top:.66em;
  width:.36em;height:.36em;background:var(--rubric);transform:rotate(45deg);
}
.case{list-style:none;padding:0}
.case > li{margin:0 0 1.7em}
.case h3{
  display:flex;align-items:baseline;gap:.55em;
  margin:0 0 .3em;
  font-family:var(--font-display);font-weight:500;font-size:1.18em;line-height:1.2;
}
.num{min-width:1.95em;color:var(--rubric);font-weight:700;font-variant-numeric:lining-nums}
.case p{margin-bottom:.35em}
.rubric{margin:.15em 0 0;text-align:right;font-style:italic;font-size:1.04em;color:var(--rubric);text-wrap:balance}
.ps{margin-top:2.6em;margin-bottom:.4em;font-family:var(--font-hand);color:var(--bran-ink);transform:rotate(-1.4deg);hyphens:none;-webkit-hyphens:none}
.ps p{margin:0}
.ps-line{font-size:1.5em;line-height:1.38}
.ps-sign{font-size:2.15em;line-height:1.1;text-align:right;padding-right:.5em;margin-top:.15em}
.ps.armed .w{opacity:0;transition:opacity .5s ease}
.ps.armed.write .w{opacity:1}

.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

.music-btn{
  position:fixed;right:16px;bottom:16px;z-index:5;
  width:48px;height:48px;padding:0;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(12,21,33,.82);color:#ecdcae;
  border:1px solid rgba(232,214,162,.45);
  box-shadow:0 6px 18px rgba(0,0,0,.45);
  cursor:pointer;
}
.music-btn svg{width:22px;height:22px}
.music-btn .icon-off{display:none}
.music-btn:not(.is-on) .icon-on{display:none}
.music-btn:not(.is-on) .icon-off{display:block}
.music-btn:focus-visible{outline:2px solid #e8d6a2;outline-offset:3px}

@media (min-width:640px){
  .gate{gap:30px}
  .field{flex-direction:row}
  #answer{flex:1 1 auto;text-align:left}
  .field .btn{flex:0 0 auto}
  .step:has(.field){width:min(100%,520px)}
  .letter{padding-top:40px}
  .sheet{padding-left:calc(var(--tex-w) * 0.037 + 56px);padding-right:calc(var(--tex-w) * 0.037 + 56px);font-size:1.2rem}
  .rubric{margin-right:-.4em}
}

@media (prefers-reduced-motion:reduce){
  .btn{transition:none}
}
</style>
</head>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const gate = $('#gate'), letter = $('#letter'), sheet = $('#sheet'), unrollBox = $('#unroll');
  const stepConfirm = $('#step-confirm'), stepNotYet = $('#step-notyet'), form = $('#step-answer');
  const input = $('#answer'), feedback = $('#feedback'), btnBreak = $('#btn-break'), seal = $('#seal');
  const reduce = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const canAnimate = !reduce && typeof Element.prototype.animate === 'function';
  const DATA = JSON.parse($('#seal-data').textContent);
  const subtle = window.crypto && window.crypto.subtle;
  const enc = new TextEncoder();
  const bytes = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

  const music = $('#music'), musicBtn = $('#music-btn');
  let musicUnlocked = false, fadeTimer = 0;

  // iOS и Safari разрешают звук только из нажатия: «будим» плеер беззвучно на первом клике,
  // чтобы потом, когда печать сломается, музыка смогла заиграть сама.
  function unlockMusic() {
    if (musicUnlocked || !music) return;
    musicUnlocked = true;
    try {
      music.muted = true;
      const p = music.play();
      music.pause();
      if (p && p.catch) p.catch(() => {});
    } catch (e) { /* без звука, не страшно */ }
    music.muted = false;
  }
  function setMusicUi(on) {
    const label = on ? 'Выключить музыку' : 'Включить музыку';
    musicBtn.classList.toggle('is-on', on);
    musicBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    musicBtn.setAttribute('aria-label', label);
    musicBtn.title = label;
  }
  function fadeIn(target, ms) {
    clearInterval(fadeTimer);
    try { music.volume = 0; } catch (e) {}
    const t0 = performance.now();
    fadeTimer = setInterval(() => {
      const k = Math.min(1, (performance.now() - t0) / ms);
      try { music.volume = target * k; } catch (e) {}
      if (k >= 1) clearInterval(fadeTimer);
    }, 50);
  }
  async function startMusic(fromStart) {
    if (!music) return;
    musicBtn.hidden = false;
    try {
      if (fromStart) music.currentTime = 0;
      fadeIn(0.85, 2500);
      await music.play();
      setMusicUi(true);
    } catch (e) {
      clearInterval(fadeTimer);
      try { music.volume = 0.85; } catch (_) {}
      setMusicUi(false);
    }
  }
  if (music && musicBtn) {
    musicBtn.addEventListener('click', () => {
      if (music.paused) startMusic(music.ended);
      else { clearInterval(fadeTimer); music.pause(); setMusicUi(false); }
    });
    music.addEventListener('play', () => setMusicUi(!music.muted));
    music.addEventListener('pause', () => setMusicUi(false));
    music.addEventListener('ended', () => setMusicUi(false));
  }

  let state = { word: null, openedAt: null };
  let wrong = 0, busy = false;
  window.claude?.hot?.snapshot?.(() => state);

  const EGGS = [
    [['ходор', 'hodor'], 'Ходор.'],
    [['бран', 'брандон', 'bran'], 'Интересно, почему ты вспомнил именно его. Но нет.'],
    [['джон', 'сноу', 'jon', 'snow'], 'Ты ничего не знаешь, Джон Сноу.'],
  ];
  const DUNNO = /не\s*знаю|хз|забыл|без понятия|понятия не имею/;
  const WRONG = [
    'Нет. Печать не поддаётся.',
    'Мимо. Третья серия восьмого сезона была очень тёмной, понимаю. Но нет.',
    'Не угадал. Попробуй ещё раз.',
  ];
  const GIVE_UP = 'Похоже, финал у тебя ещё впереди. Досмотри и возвращайся, письмо подождёт.';

  function showStep(step) {
    for (const el of [stepConfirm, stepNotYet, form]) el.hidden = el !== step;
  }
  let artLoaded = false;
  function preloadLetterArt() {
    if (artLoaded) return;
    artLoaded = true;
    for (const src of ['scroll-roll.webp', 'sheet.webp']) { const im = new Image(); im.src = src; }
  }
  $('#btn-yes').addEventListener('click', () => { unlockMusic(); preloadLetterArt(); showStep(form); input.focus(); });
  $('#btn-no').addEventListener('click', () => { showStep(stepNotYet); $('#btn-back').focus(); });
  $('#btn-back').addEventListener('click', () => { showStep(stepConfirm); $('#btn-yes').focus(); });

  function say(text) { feedback.textContent = text; }

  function shake() {
    if (!canAnimate) return;
    seal.animate([
      { transform: 'translate(-50%,-50%) rotate(0deg)' },
      { transform: 'translate(-50%,-50%) rotate(-8deg)' },
      { transform: 'translate(-50%,-50%) rotate(6deg)' },
      { transform: 'translate(-50%,-50%) rotate(-3deg)' },
      { transform: 'translate(-50%,-50%) rotate(0deg)' },
    ], { duration: 440, easing: 'ease-out' });
  }

  function wordsOf(raw) {
    return raw.normalize('NFC').toLowerCase().replace(/ё/g, 'е')
      .replace(/[^a-zа-я]+/g, ' ').trim().split(' ').filter(Boolean);
  }
  function candidatesOf(list) {
    const set = new Set();
    for (const w of list) { set.add(w); if (w.length > 4) set.add(w.slice(0, 4)); }
    if (list.length > 1) set.add(list.join(''));
    return [...set].filter((w) => w.length >= 3).slice(0, 8);
  }

  async function unwrap(word) {
    const base = await subtle.importKey('raw', enc.encode(word), 'PBKDF2', false, ['deriveKey']);
    const kek = await subtle.deriveKey(
      { name: 'PBKDF2', salt: bytes(DATA.salt), iterations: DATA.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    for (const k of DATA.keys) {
      try { return await subtle.decrypt({ name: 'AES-GCM', iv: bytes(k.iv) }, kek, bytes(k.ct)); }
      catch (e) { /* не этот ключ */ }
    }
    return null;
  }
  async function readLetter(rawKey) {
    const key = await subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt']);
    const plain = await subtle.decrypt({ name: 'AES-GCM', iv: bytes(DATA.iv) }, key, bytes(DATA.ct));
    return new TextDecoder().decode(plain);
  }

  function whenText(ts) {
    const d = new Date(ts);
    const days = ['в воскресенье', 'в понедельник', 'во вторник', 'в среду', 'в четверг', 'в пятницу', 'в субботу'];
    const months = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
    const nb = ' ';
    return `${days[d.getDay()].replace(' ', nb)}, ${d.getDate()}${nb}${months[d.getMonth()]}, в${nb}${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
  }
  function fillPostscript() {
    const line = $('.ps-line', sheet);
    if (line) line.textContent = `P.S. Я знал, что ты откроешь это письмо ${whenText(state.openedAt || Date.now())}.`;
  }
  function armPostscript() {
    const ps = $('.ps', sheet);
    if (!ps || !canAnimate || !('IntersectionObserver' in window)) return;
    let i = 0;
    for (const part of ps.querySelectorAll('.ps-line, .ps-sign')) {
      const pieces = part.textContent.split(/(\s+)/);
      const extra = part.classList.contains('ps-sign') ? 600 : 0;
      part.textContent = '';
      for (const piece of pieces) {
        if (!piece) continue;
        if (/^\s+$/.test(piece)) { part.append(piece); continue; }
        const w = document.createElement('span');
        w.className = 'w';
        w.textContent = piece;
        w.style.transitionDelay = (i++ * 130 + extra) + 'ms';
        part.append(w);
      }
    }
    ps.classList.add('armed');
    const io = new IntersectionObserver((entries) => {
      if (entries.some((e) => e.isIntersecting)) { ps.classList.add('write'); io.disconnect(); }
    }, { threshold: 0.6 });
    io.observe(ps);
  }

  function showLetterNow() {
    gate.hidden = true;
    letter.hidden = false;
    unrollBox.style.maxHeight = '';
    window.scrollTo(0, 0);
    armPostscript();
    $('#letter-title').focus({ preventScroll: true });
  }

  async function reveal(html, instant) {
    sheet.innerHTML = html;
    fillPostscript();
    if (instant) { musicBtn.hidden = false; setMusicUi(false); }
    else startMusic(true);
    if (instant || !canAnimate) { showLetterNow(); return; }

    // 1. Печать трескается и разваливается
    const crack = $('.crack', seal);
    const gateRoll = $('.scroll-img', gate);
    const from = gateRoll.getBoundingClientRect();
    await crack.animate([{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }],
      { duration: 340, easing: 'ease-in', fill: 'forwards' }).finished;
    crack.parentNode.style.opacity = '0';
    const moves = [
      $('.half-l', seal).animate([{ transform: 'none', opacity: 1 }, { transform: 'translate(-48px,150px) rotate(-34deg)', opacity: 0 }],
        { duration: 860, easing: 'cubic-bezier(.45,0,.85,.5)', fill: 'forwards' }),
      $('.half-r', seal).animate([{ transform: 'none', opacity: 1 }, { transform: 'translate(42px,160px) rotate(27deg)', opacity: 0 }],
        { duration: 920, easing: 'cubic-bezier(.45,0,.85,.5)', fill: 'forwards' }),
    ];
    for (const el of gate.querySelectorAll('.gate-text, .step:not([hidden])')) {
      moves.push(el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 420, delay: 140, fill: 'forwards' }));
    }
    moves.push(gateRoll.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 520, delay: 420, fill: 'forwards' }));
    await Promise.all(moves.map((a) => a.finished));

    // 2. Свиток переезжает наверх
    unrollBox.style.maxHeight = '0px';
    gate.hidden = true;
    letter.hidden = false;
    window.scrollTo(0, 0);
    const rolls = letter.querySelectorAll('.roll');
    const to = rolls[0].getBoundingClientRect();
    const dy = from.top - to.top, sx = from.width / to.width;
    await Promise.all([...rolls].map((r) => r.animate(
      [{ transform: `translateY(${dy}px) scaleX(${sx})`, opacity: 0 }, { opacity: 1, offset: 0.35 }, { transform: 'none', opacity: 1 }],
      { duration: 700, easing: 'cubic-bezier(.2,.7,.2,1)' }).finished));

    // 3. Свиток разворачивается
    const full = sheet.scrollHeight;
    await unrollBox.animate([{ maxHeight: '0px' }, { maxHeight: full + 'px' }],
      { duration: 1900, easing: 'cubic-bezier(.55,.02,.75,.3)' }).finished;
    unrollBox.style.maxHeight = '';
    armPostscript();
    $('#letter-title').focus({ preventScroll: true });
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    unlockMusic();
    preloadLetterArt();
    if (busy) return;
    const raw = input.value;
    const list = wordsOf(raw);
    if (!list.length) { say('Впиши имя, и печать проверит ответ.'); shake(); input.focus(); return; }
    if (!subtle) { say('Этот браузер не умеет вскрывать печать. Открой ссылку в Chrome или Safari.'); return; }

    busy = true;
    btnBreak.disabled = true;
    btnBreak.textContent = 'Проверяю…';
    say('');
    let rawKey = null, hit = null;
    try {
      for (const c of candidatesOf(list)) {
        rawKey = await unwrap(c);
        if (rawKey) { hit = c; break; }
      }
    } catch (err) { console.error(err); }

    if (rawKey) {
      try {
        const html = await readLetter(rawKey);
        state = { word: hit, openedAt: Date.now() };
        await reveal(html, false);
        return;
      } catch (err) {
        console.error(err);
        say('Печать треснула, но не открылась. Обнови страницу и попробуй ещё раз.');
      }
    } else {
      wrong += 1;
      const egg = EGGS.find(([keys]) => list.some((w) => keys.includes(w)));
      let msg;
      if (egg) msg = egg[1];
      else if (DUNNO.test(list.join(' '))) msg = 'Значит, ещё рано. Досмотри и возвращайся.';
      else if (wrong === 4) msg = GIVE_UP;
      else msg = WRONG[(wrong - 1) % WRONG.length];
      say(msg);
      shake();
      input.select();
    }
    busy = false;
    btnBreak.disabled = false;
    btnBreak.textContent = 'Сломать печать';
  });

  function start(data) {
    if (!data || !data.word || !subtle) return;
    (async () => {
      try {
        const rawKey = await unwrap(data.word);
        if (!rawKey) return;
        state = { word: data.word, openedAt: data.openedAt || Date.now() };
        await reveal(await readLetter(rawKey), true);
      } catch (e) { /* остаёмся на печати */ }
    })();
  }
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
